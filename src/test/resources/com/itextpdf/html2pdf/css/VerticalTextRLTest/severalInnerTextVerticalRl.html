<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>inner vertical-rl spans in horizontal paragraph</title>
    <style>
        h1 {
            font-size: 16px;
        }

        body {
            font-family: sans-serif;
            padding: 20px;
        }
    </style>
</head>
<body>
<h1>inner vertical-rl spans in horizontal paragraph</h1>
<p style="height: 300px; font-size: 16px; border: 1px solid black;">
    <span style="writing-mode: vertical-rl; text-orientation: upright;
    background-color: yellow;">The quick brown fox jumps over the lazy dog. 1234567890 ABCDEFG abcdefg.</span><span
        style="writing-mode: vertical-rl; text-orientation: upright;
    background-color: pink;">One more vertical RTL text.</span>
</p>
</body>
</html>
