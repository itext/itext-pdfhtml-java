<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    @font-face {
        font-family: 'NotoSans';
        src: url('../../fonts/NotoSansCJKsc-Light.otf');
    }
    body {
        font-family: NotoSans;
        padding: 20px;
    }

    span {
        border: 1px solid #999;
    }

    .vertical {
        writing-mode: vertical-lr;
        text-orientation: upright;

        border: 1px solid #333;
        padding: 10px;
        margin: 20px;
    }
  </style>
</head>
<body>
    <div class="vertical">
      <span>1. Some vertical text that wil wrap around to the next vertical lines</span>
      <span>2. Some vertical text that wil wrap around to the next vertical lines</span>
      <span>3. Some vertical text that wil wrap around to the next vertical lines</span>
    </div>
</body>
</html>
