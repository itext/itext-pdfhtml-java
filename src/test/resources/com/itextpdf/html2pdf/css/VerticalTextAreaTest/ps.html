<!DOCTYPE html>
<html lang="en">
<head>

    <title>Title</title>
  <style>
    @font-face {
        font-family: 'NotoSans';
        src: url('../../fonts/NotoSansCJKsc-Light.otf');
    }
    body {
        font-family: NotoSans;
        padding: 20px;
    }

    .vertical {
        writing-mode: vertical-lr;
        text-orientation: upright;
        height: 200px;
        border: 1px solid #999;
        padding: 10px;
        margin: 20px;
    }
  </style>
</head>
<body>
  <p class="vertical">1. Some vertical text that wil wrap around to the next vertical lines</p>
  <p class="vertical">2. Some vertical text that wil wrap around to the next vertical lines</p>
  <p class="vertical">3. Some vertical text that wil wrap around to the next vertical lines</p>
  <p class="vertical">4. Some vertical text that wil wrap around to the next vertical lines</p>
</body>
</html>
