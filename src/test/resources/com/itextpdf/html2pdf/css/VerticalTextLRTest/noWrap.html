<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=BioRhyme+Expanded:wght@200;300;400;700;800&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'BioRhyme Expanded'; line-height: normal">
<p style="writing-mode: horizontal-tb; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; white-space: wrap">
    white-space: wrap
</p>
<p style="writing-mode: vertical-lr; text-orientation: upright; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: wrap">
    white-space: wrap
</p>

<p style="writing-mode: horizontal-tb; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: nowrap">
    white-space: nowrap
</p>
<p style="writing-mode: vertical-lr; text-orientation: upright; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: nowrap">
    white-space: nowrap
</p>

<p style="writing-mode: horizontal-tb; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: pre">
    white-space:
    pre
</p>
<p style="writing-mode: vertical-lr; text-orientation: upright; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: pre">
    white-space:
    pre
</p>

<p style="writing-mode: horizontal-tb; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: break-spaces">
    white-space: break-spaces
</p>
<p style="writing-mode: vertical-lr; text-orientation: upright; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: break-spaces">
    white-space: break-spaces
</p>

<p style="writing-mode: horizontal-tb; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: pre-wrap">
    white-space: pre-wrap
</p>
<p style="writing-mode: vertical-lr; text-orientation: upright; height: 450px; width: 300px; font-size: 50px;
overflow-x: visible; overflow-y: visible; overflow-wrap: normal; word-break: normal;
background-color: #bbbbff; page-break-before: always; white-space: pre-wrap">
    white-space: pre-wrap
</p>
</body>
</html>
