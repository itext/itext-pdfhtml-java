<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr + blockquote + cite</title>
<style>
@font-face {
    font-family: 'NotoSans';
    src: url('../../fonts/NotoSansCJKsc-Light.otf');
}

h1 {
    font-size: 16px;
}

body {

    font-family: NotoSans;
    padding: 20px;
}

blockquote.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    border-left: 4px solid #999;
    border-top: none;
    padding: 10px;
    margin: 0;
    height: 240px;
    font-style: italic;
    color: #2c5f8a;
}

cite {
    display: block;
    font-style: normal;
    font-size: 12px;
    margin-top: 8px;
}
</style>
</head>
<body>
<h1>vertical-lr + blockquote + cite</h1>
<blockquote class="vtext">Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor.<cite>lorem ipsum source</cite></blockquote>
</body>
</html>
