<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr + letter-spacing</title>
<style>
@font-face {
    font-family: 'NotoSans';
    src: url('../../fonts/NotoSansCJKsc-Light.otf');
}

h1 {
    font-size: 16px;
}

body {
    font-family: NotoSans;
    padding: 20px;
}

.row {
    display: flex;
    gap: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    height: 260px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
}

.ls-0 {
    letter-spacing: 0px;
}

.ls-5 {
    letter-spacing: 5px;
}

.ls-15 {
    letter-spacing: 15px;
}

.ls-neg {
    letter-spacing: -7px;
}
</style>
</head>
<body>
<h1>vertical-lr + letter-spacing</h1>
<div class="row">
<div class="vtext ls-0">letter-spacing 0px ABCDEFGHIJK</div>
<div class="vtext ls-5">letter-spacing 5px ABCDEFGHIJK</div>
<div class="vtext ls-15">letter-spacing 15px ABCDEFGHIJK</div>
<div class="vtext ls-neg">letter-spacing -7px ABCDEFGHIJK</div>
</div>
</body>
</html>
