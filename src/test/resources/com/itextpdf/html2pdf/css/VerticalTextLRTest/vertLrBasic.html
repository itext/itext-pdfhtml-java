<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr</title>
<style>
@font-face {
    font-family: 'NotoSans';
    src: url('../../fonts/NotoSansCJKsc-Light.otf');
}
h1 {
    font-size: 16px;
}

body {
    font-family: NotoSans;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    height: 300px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
}
</style>
</head>
<body>
<!--<h1>vertical-lr</h1>-->
<p class="vtext">The quick brown fox jumps over the lazy dog. 1234567890 ABCDEFG abcdefg.</p>
</body>
</html>
