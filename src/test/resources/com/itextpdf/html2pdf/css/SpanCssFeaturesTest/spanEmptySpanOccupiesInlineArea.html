<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>spanEmptySpanOccupiesInlineArea</title>
<style>
body {
    font-family: Times;
    font-size: 14px;
    margin: 12px;
}
.label {
    font-size: 10px;
    color: #555555;
    margin: 10px 0 2px 0;
}
.row {
    border: 1px dotted #999999;
    padding: 4px;
}
</style>
</head>
<body>
<div class="label">Empty span with horizontal padding between letters</div>
<div class="row">A<span style="padding: 0 20px; background: #ffe0e0"></span>B</div>
<div class="label">Empty span with border</div>
<div class="row">A<span style="border: 4px solid #cc0000"></span>B</div>
<div class="label">Empty span with horizontal margin</div>
<div class="row">A<span style="margin: 0 20px; background: #ffe0e0"></span>B</div>
<div class="label">Empty span with only vertical padding and border (zero width)</div>
<div class="row">A<span style="padding: 10px 0; border-top: 3px solid #cc0000; border-bottom: 3px solid #0000cc"></span>B</div>
<div class="label">Nested empty spans, each contributing horizontal padding</div>
<div class="row">A<span style="padding: 0 10px; background: #ffe0e0"><span style="padding: 0 10px; background: #e0e0ff"><span style="padding: 0 10px; background: #e0ffe0"></span></span></span>B</div>
<div class="label">Span containing only a collapsible space</div>
<div class="row">A<span style="padding: 0 10px; border: 1px solid #cc0000"> </span>B</div>
</body>
</html>
