<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>grid item with min-width 0 override, forcing shrink below content size</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr;
    border: 1px dashed #666;
    padding: 10px;
    width: 160px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    border: 1px solid #999;
    padding: 8px;
    margin: 0;
    height: 200px;
    min-width: 0;
    overflow: visible;
}
</style>
</head>
<body>
<h1>grid item with min-width 0 override, forcing shrink below content size in a narrow track</h1>
<div class="grid">
<p class="vtext">a long stretch of vertical text content that the grid track is now allowed to shrink past its natural minimum width</p>
</div>
</body>
</html>
