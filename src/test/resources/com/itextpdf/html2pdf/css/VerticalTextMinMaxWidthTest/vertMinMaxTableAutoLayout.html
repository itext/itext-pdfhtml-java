<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>table-layout auto, vertical-lr cell among horizontal cells</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

table {
    border-collapse: collapse;
}

th, td {
    border: 1px solid #999;
    padding: 8px;
}

td.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
}
</style>
</head>
<body>
<h1>table-layout auto, vertical-lr cell among horizontal cells</h1>
<table>
<tr>
<th>short</th>
<th>medium length header</th>
<th>v</th>
</tr>
<tr>
<td>a</td>
<td>a somewhat longer piece of horizontal content here</td>
<td class="vtext">a fairly long stretch of vertical text content that needs several columns</td>
</tr>
</table>
</body>
</html>
