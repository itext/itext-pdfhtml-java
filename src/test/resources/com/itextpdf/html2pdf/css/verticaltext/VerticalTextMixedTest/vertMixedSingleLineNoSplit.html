<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mixed direction segment inside a single unsplit line</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    text-orientation: upright;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 400px;
}

.seg-rl {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    vertical-align: middle;
}

.switch {
    display: inline-block;
    writing-mode: vertical-lr;
    text-orientation: upright;
    border: 1px dashed #c0392b;
    padding: 4px;
    vertical-align: middle;
}
</style>
</head>
<body>
<h1>mixed direction segment inside a single unsplit line</h1>
<p class="vtext"><span class="seg-rl">short start</span> <span class="switch">switch</span> <span class="seg-rl">short end</span></p>
</body>
</html>
