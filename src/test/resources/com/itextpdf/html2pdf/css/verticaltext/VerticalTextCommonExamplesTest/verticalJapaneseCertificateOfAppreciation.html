<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    body { margin: 20pt; }
    .certificate {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        width: 420pt;
        height: 500pt;
        padding: 24pt;
        border: 3px double #333;
        font-size: 14pt;
        line-height: 2;
    }
    .title { font-size: 34pt; margin-left: 30pt; }
    .recipient { font-size: 20pt; margin-left: 24pt; }
    .body { height: 380pt; margin-left: 24pt; }
    .date { font-size: 13pt; margin-left: 12pt; }
    .issuer { font-size: 15pt; text-align: end; }
</style>
</head>
<body>
<div class="certificate">
<div class="title">感謝状</div>
<div class="recipient">山田　太郎　殿</div>
<div class="body">あなたは永年にわたり地域社会の発展に尽力され　その功績はまことに顕著であります　ここに深く感謝の意を表し　記念品を贈呈いたします</div>
<div class="date">令和八年九月吉日</div>
<div class="issuer">株式会社サンプル</div>
<div class="issuer">代表取締役　鈴木　一郎</div>
</div>
</body>
</html>
