<!-- Tests: hanging-punctuation: first allow-end support check -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    .col {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 16pt;
        line-height: 1.8;
        width: 140px;
        border: 1px solid black;
        display: inline-block;
        padding: 10px;
        text-align: justify;
        margin-right: 14px;
    }
    .hang {
        hanging-punctuation: first allow-end;
    }
</style>
</head>
<body>
<div class="col">これは行末のぶら下げ組みを確認するための文章です。句点や読点が行の外側にはみ出すかどうかを見ます。</div>
<div class="col hang">これは行末のぶら下げ組みを確認するための文章です。句点や読点が行の外側にはみ出すかどうかを見ます。</div>
</body>
</html>
