<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>vertical-rl + Noto Sans SC Bold weight</title>
<style>
@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Regular.otf");
    font-weight: normal;
}

@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Bold.otf");
    font-weight: bold;
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.row {
    display: flex;
    gap: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Noto Sans SC";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 260px;
}

.regular {
    font-weight: normal;
}

.bold {
    font-weight: bold;
}
</style>
</head>
<body>
<h1>vertical-rl + Noto Sans SC, regular vs bold weight</h1>
<div class="row">
<p class="vtext regular">春眠不觉晓，处处闻啼鸟。</p>
<p class="vtext bold">春眠不觉晓，处处闻啼鸟。</p>
</div>
</body>
</html>
