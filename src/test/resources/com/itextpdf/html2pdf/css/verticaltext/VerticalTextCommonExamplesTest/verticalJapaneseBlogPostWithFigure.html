<h1>秋の京都散歩</h1>
<p class="meta"><time datetime="2026-09-28"><span class="tcy">2026</span>年<span class="tcy">9</span>月<span class="tcy">28</span>日</time>　投稿者：さくら</p>
<p>先週末、久しぶりに京都を訪れました。朝の空気はひんやりとしていて、歩くのにちょうどいい季節です。</p>

<p>途中で立ち寄った小さな茶店では、温かい抹茶と季節の和菓子をいただきました。次回は紅葉の時期にも来てみたいと思います。</p>
<blockquote>「急がず、ゆっくり歩くのがいちばん。」</blockquote>
