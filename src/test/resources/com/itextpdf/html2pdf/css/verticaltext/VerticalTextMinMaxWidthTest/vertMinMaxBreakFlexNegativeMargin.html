<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>negative margin pulling a vertical-lr flex item outside its container bounds</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

.flexrow {
    display: flex;
    border: 1px dashed #666;
    padding: 10px;
    width: 260px;
    overflow: visible;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    border: 1px solid #999;
    padding: 8px;
    height: 180px;
    flex: 0 0 auto;
    margin-left: -60px;
    margin-right: -60px;
}
</style>
</head>
<body>
<h1>negative left and right margin pulling a vertical-lr flex item outside its container bounds on both sides</h1>
<div class="flexrow">
<p class="vtext">vertical text content pulled outside the dashed container by negative margins</p>
</div>
</body>
</html>
