<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    body {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 12pt;
        line-height: 1.8;
        margin: 20pt;
    }
    h1 { font-size: 18pt; }
    table { border-collapse: collapse; margin: 0 1em; }
    caption { font-size: 12pt; }
    th, td { border: 1px solid #333; padding: 4pt 6pt; text-align: center; }
    th { background-color: #e8e8e8; }
    p { margin: 0; text-indent: 1em; }
    .tcy { text-combine-upright: all; }
</style>
</head>
<body>
<h1>学級だより　秋の運動会</h1>
<table>
<caption>運動会　得点表</caption>
<tr><th>組</th><th>得点</th><th>順位</th></tr>
<tr><td>赤組</td><td><span class="tcy">320</span>点</td><td><span class="tcy">1</span>位</td></tr>
<tr><td>白組</td><td><span class="tcy">300</span>点</td><td><span class="tcy">2</span>位</td></tr>
<tr><td>青組</td><td><span class="tcy">280</span>点</td><td><span class="tcy">3</span>位</td></tr>
<tr><td>黄組</td><td><span class="tcy">260</span>点</td><td><span class="tcy">4</span>位</td></tr>
</table>
<p>たくさんのご声援をありがとうございました。</p>
</body>
</html>
