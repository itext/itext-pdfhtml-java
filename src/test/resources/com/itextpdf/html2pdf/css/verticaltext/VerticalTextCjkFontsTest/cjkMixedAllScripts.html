<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>all six CJK and Mongolian fonts mixed in same paragraph</title>
<style>
@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Regular.otf");
    font-weight: normal;
}

@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Bold.otf");
    font-weight: bold;
}

@font-face {
    font-family: "Noto Serif SC";
    src: url("../../../fonts/NotoSerifCJKsc-Regular.otf");
}

@font-face {
    font-family: "Noto Sans JP";
    src: url("../../../fonts/NotoSansCJKjp-Regular.otf");
}

@font-face {
    font-family: "Noto Sans KR";
    src: url("../../../fonts/NotoSansCJKkr-Regular.otf");
}

@font-face {
    font-family: "Noto Sans Mongolian";
    src: url("../../../fonts/NotoSansMongolian-Regular.ttf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 20px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 340px;
}

.seg-sans-sc {
    font-family: "Noto Sans SC";
}

.seg-sans-sc-bold {
    font-family: "Noto Sans SC";
    font-weight: bold;
}

.seg-serif-sc {
    font-family: "Noto Serif SC";
}

.seg-sans-jp {
    font-family: "Noto Sans JP";
}

.seg-sans-kr {
    font-family: "Noto Sans KR";
}

.seg-mongolian {
    display: inline-block;
    writing-mode: vertical-lr;
    font-family: "Noto Sans Mongolian";
    vertical-align: middle;
}
</style>
</head>
<body>
<h1>All six fonts and scripts stress test, mixed in the same paragraph</h1>
<p class="vtext"><span class="seg-sans-sc">简体中文</span><span class="seg-sans-sc-bold">粗体汉字</span><span class="seg-serif-sc">宋体引文</span><span class="seg-sans-jp">日本語</span><span class="seg-sans-kr">한국어</span><span class="seg-mongolian">ᠮᠣᠩᠭᠣᠯ</span></p>
</body>
</html>
