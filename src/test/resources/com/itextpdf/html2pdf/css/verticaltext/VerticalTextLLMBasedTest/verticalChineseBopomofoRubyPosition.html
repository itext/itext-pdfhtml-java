<!-- Tests: Bopomofo ruby position: horizontal default vs inter-character vs vertical default -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKtc';
        src: url('../../../fonts/NotoSansCJKtc-Regular.otf') format('opentype');
    }
    .label {
        font-size: 9pt;
        font-family: 'NotoSansCJKtc';
    }
    .h {
        font-family: 'NotoSansCJKtc';
        font-size: 20pt;
        border: 1px solid black;
        padding: 10px;
        display: inline-block;
        margin-right: 14px;
    }
    .v {
        font-family: 'NotoSansCJKtc';
        font-size: 20pt;
        writing-mode: vertical-rl;
        border: 1px solid black;
        padding: 10px;
        display: inline-block;
        height: 160px;
    }
    .inter {
        ruby-position: inter-character;
    }
</style>
</head>
<body>
<div><span class="label">horizontal, default ruby-position：</span><div class="h"><ruby>國<rt>ㄍㄨㄛˊ</rt></ruby><ruby>語<rt>ㄩˇ</rt></ruby></div></div>
<div><span class="label">horizontal, ruby-position: inter-character：</span><div class="h inter"><ruby>國<rt>ㄍㄨㄛˊ</rt></ruby><ruby>語<rt>ㄩˇ</rt></ruby></div></div>
<div><span class="label">vertical-rl, default ruby-position：</span><div class="v"><ruby>國<rt>ㄍㄨㄛˊ</rt></ruby><ruby>語<rt>ㄩˇ</rt></ruby></div></div>
</body>
</html>
