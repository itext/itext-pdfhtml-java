<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-rl ltr and vertical-lr rtl text objects mixed in same paragraph</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    text-orientation: upright;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 240px;
}

.seg-outer {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    direction: ltr;
    vertical-align: middle;
}

.seg-inner {
    display: inline-block;
    writing-mode: vertical-lr;
    text-orientation: upright;
    direction: rtl;
    border: 1px dashed #27ae60;
    padding: 4px;
    vertical-align: middle;
}
</style>
</head>
<body>
<h1>vertical-rl ltr and vertical-lr rtl text objects mixed in same paragraph</h1>
<p class="vtext"><span class="seg-outer">outer rl ltr segment</span> <span class="seg-inner">inner lr rtl segment</span> <span class="seg-outer">outer rl ltr segment again</span></p>
</body>
</html>
