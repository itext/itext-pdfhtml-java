<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-rl and vertical-lr text objects mixed in same paragraph</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    text-orientation: upright;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 240px;
}

.seg-rl {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    vertical-align: middle;
}

.seg-lr {
    display: inline-block;
    writing-mode: vertical-lr;
    text-orientation: upright;
    border: 1px dashed #c0392b;
    padding: 4px;
    vertical-align: middle;
}
</style>
</head>
<body>
<h1>vertical-rl and vertical-lr text objects mixed in same paragraph</h1>
<p class="vtext"><span class="seg-rl">before the switch</span> <span class="seg-lr">middle segment reversed</span> <span class="seg-rl">after the switch continues</span></p>
</body>
</html>
