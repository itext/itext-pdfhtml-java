<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    body { margin: 20pt; }
    .headline {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        display: inline-block;
        height: 260pt;
        font-size: 24pt;
        font-weight: bold;
        margin-left: 12pt;
    }
    .article {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        display: inline-block;
        height: 260pt;
        column-count: 2;
        column-gap: 1.5em;
        font-size: 11pt;
        line-height: 1.7;
        text-align: justify;
    }
    .article p { margin: 0; text-indent: 1em; }
</style>
</head>
<body>
<div class="article">
<p>さくら市の中央公園で二十八日、恒例の秋の収穫祭が開かれた。会場には地元の農家が育てた米や野菜、果物が並び、朝早くから多くの家族連れでにぎわった。</p>
<p>催しの目玉は、来場者が参加できる餅つき大会。子どもたちは大きなきねを手に、威勢のよい掛け声に合わせて餅をついた。できあがった餅はその場で振る舞われ、あちこちで笑顔が広がった。</p>
<p>実行委員長の山田さんは「今年は天候にも恵まれ、たくさんの方に来ていただけた。来年もぜひ続けたい」と話していた。</p>
</div><div class="headline">さくら市で秋の収穫祭</div>
</body>
</html>
