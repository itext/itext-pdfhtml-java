<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    body {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 12pt;
        line-height: 1.9;
        margin: 20pt;
    }
    h1 { font-size: 20pt; }
    h2 { font-size: 14pt; }
    ul, ol { margin: 0; padding: 0 0 0 1.5em; }
    li { margin: 0; }
</style>
</head>
<body>
<h1>だし巻き卵の作り方</h1>
<h2>材料（二人分）</h2>
<ul>
<li>卵　三個</li>
<li>だし汁　大さじ四</li>
<li>砂糖　小さじ一</li>
<li>塩　少々</li>
<li>油　適量</li>
</ul>
<h2>作り方</h2>
<ol>
<li>卵をボウルに割り入れ、よくほぐす。</li>
<li>だし汁、砂糖、塩を加えて混ぜる。</li>
<li>卵焼き器に油をなじませ、卵液の三分の一を流し入れる。</li>
<li>表面が固まってきたら、奥から手前に向かって巻く。</li>
<li>残りの卵液を二回に分けて同じように焼き、形を整えて切り分ける。</li>
</ol>
</body>
</html>
