<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>a lone combining diacritical mark with no base character</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    font-size: 30px;
    border: 1px solid #999;
    padding: 8px;
    margin: 0;
    height: 100px;
}
</style>
</head>
<body>
<h1>a lone combining acute accent mark with no base character in front of it</h1>
<p class="vtext">&#x301;</p>
</body>
</html>
