<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>vertical font metrics comparison across six CJK and Mongolian fonts</title>
<style>
@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Regular.otf");
    font-weight: normal;
}

@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Bold.otf");
    font-weight: bold;
}

@font-face {
    font-family: "Noto Serif SC";
    src: url("../../../fonts/NotoSerifCJKsc-Regular.otf");
}

@font-face {
    font-family: "Noto Sans JP";
    src: url("../../../fonts/NotoSansCJKjp-Regular.otf");
}

@font-face {
    font-family: "Noto Sans KR";
    src: url("../../../fonts/NotoSansCJKkr-Regular.otf");
}

@font-face {
    font-family: "Noto Sans Mongolian";
    src: url("../../../fonts/NotoSansMongolian-Regular.ttf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-start;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 24px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 220px;
    background: repeating-linear-gradient(to right, #eee 0px, #eee 1px, transparent 1px, transparent 20px);
}

.f-sans-sc {
    font-family: "Noto Sans SC";
}

.f-sans-sc-bold {
    font-family: "Noto Sans SC";
    font-weight: bold;
}

.f-serif-sc {
    font-family: "Noto Serif SC";
}

.f-sans-jp {
    font-family: "Noto Sans JP";
}

.f-sans-kr {
    font-family: "Noto Sans KR";
}

.f-mongolian {
    writing-mode: vertical-lr;
    font-family: "Noto Sans Mongolian";
}
</style>
</head>
<body>
<h1>vertical font metrics comparison across six fonts</h1>
<div class="row">
<p class="vtext f-sans-sc">中文字体</p>
<p class="vtext f-sans-sc-bold">中文字体</p>
<p class="vtext f-serif-sc">中文字体</p>
<p class="vtext f-sans-jp">日本語</p>
<p class="vtext f-sans-kr">한국어</p>
<p class="vtext f-mongolian">ᠮᠣᠩᠭᠣᠯ</p>
</div>
</body>
</html>
