<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>Noto Sans SC bold and regular weight mixed in same paragraph</title>
<style>
@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Regular.otf");
    font-weight: normal;
}

@font-face {
    font-family: "Noto Sans SC";
    src: url("../../../fonts/NotoSansCJKsc-Bold.otf");
    font-weight: bold;
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Noto Sans SC";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 280px;
}

.seg-bold {
    font-weight: bold;
}
</style>
</head>
<body>
<h1>Noto Sans SC bold and regular weight mixed in the same paragraph</h1>
<p class="vtext">普通文字中的<span class="seg-bold">重点强调词语</span>继续普通文字</p>
</body>
</html>
