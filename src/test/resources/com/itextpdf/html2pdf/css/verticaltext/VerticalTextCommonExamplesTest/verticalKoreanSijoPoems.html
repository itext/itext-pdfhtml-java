<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKkr';
        src: url('../../../fonts/NotoSansCJKkr-Regular.otf') format('opentype');
    }
    body { margin: 20pt; }
    .poem {
        font-family: 'NotoSansCJKkr';
        writing-mode: vertical-rl;
        text-orientation: upright;
        display: inline-block;
        height: 300pt;
        padding: 12pt;
        margin-right: 20pt;
        border: 1px solid #333;
        line-height: 2;
    }
    .title { font-size: 20pt; margin-left: 10pt; }
    .poet { font-size: 12pt; margin-left: 18pt; }
    .line { font-size: 16pt; }
</style>
</head>
<body>
<div class="poem">
<div class="title">단심가</div>
<div class="poet">정몽주</div>
<div class="line">이 몸이 죽고 죽어 일백 번 고쳐 죽어</div>
<div class="line">백골이 진토 되어 넋이라도 있고 없고</div>
<div class="line">님 향한 일편단심이야 가실 줄이 있으랴</div>
</div>
<div class="poem">
<div class="title">하여가</div>
<div class="poet">이방원</div>
<div class="line">이런들 어떠하리 저런들 어떠하리</div>
<div class="line">만수산 드렁칡이 얽혀진들 어떠하리</div>
<div class="line">우리도 이같이 얽혀 백 년까지 누리리라</div>
</div>
</body>
</html>
