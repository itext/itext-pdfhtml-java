<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>text-combine-upright with Noto Sans JP digits</title>
<style>
@font-face {
    font-family: "Noto Sans JP";
    src: url("../../../fonts/NotoSansCJKjp-Regular.otf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.row {
    display: flex;
    gap: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Noto Sans JP";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 260px;
}

.combine {
    text-combine-upright: all;
}
</style>
</head>
<body>
<h1>text-combine-upright with Noto Sans JP, date digits combined horizontally</h1>
<div class="row">
<p class="vtext">令和<span class="combine">06</span>年<span class="combine">12</span>月<span class="combine">25</span>日</p>
<p class="vtext">令和06年12月25日without combine</p>
</div>
</body>
</html>
