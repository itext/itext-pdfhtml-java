<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKsc';
        src: url('../../../fonts/NotoSansCJKsc-Regular.otf') format('opentype');
    }
    body { margin: 20pt; }
    .set { width: 230pt; text-align: center; }
    .lintel {
        font-family: 'NotoSansCJKsc';
        writing-mode: horizontal-tb;
        display: block;
        margin: 0 auto 8pt auto;
        padding: 6pt 0;
        width: 150pt;
        background-color: #c00000;
        color: #ffd24d;
        font-size: 24pt;
        text-align: center;
    }
    .banner {
        font-family: 'NotoSansCJKsc';
        writing-mode: vertical-rl;
        text-orientation: upright;
        display: inline-block;
        padding: 10pt 8pt;
        margin: 0 14pt;
        background-color: #c00000;
        color: #ffd24d;
        font-size: 30pt;
        line-height: 1.3;
    }
</style>
</head>
<body>
<div class="set">
<div class="lintel">吉祥如意</div>
<div class="banner">春满乾坤福满门</div><div class="banner">天增岁月人增寿</div>
</div>
</body>
</html>
