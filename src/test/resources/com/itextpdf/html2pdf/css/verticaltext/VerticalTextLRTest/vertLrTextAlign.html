<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr + text-align</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 320px;
}

.ta-left {
    text-align: left;
}

.ta-center {
    text-align: center;
}

.ta-right {
    text-align: right;
}

.ta-justify {
    text-align: justify;
}
</style>
</head>
<body>
<h1>vertical-lr + text-align</h1>
<div class="row">
<p class="vtext ta-left">start aligned text</p>
<p class="vtext ta-center">center aligned text</p>
<p class="vtext ta-right">end aligned text</p>
<p class="vtext ta-justify">justify spread text sample content</p>
</div>
</body>
</html>
