<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Mongolian text with an embedded sideways Latin segment</title>
<style>
@font-face {
    font-family: "Noto Sans Mongolian";
    src: url("../../../fonts/NotoSansMongolian-Regular.ttf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    font-family: "Noto Sans Mongolian";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 280px;
}

.latin-sideways {
    display: inline-block;
    font-family: sans-serif;
    text-orientation: sideways;
    vertical-align: middle;
}
</style>
</head>
<body>
<h1>Mongolian vertical-lr text with an embedded Latin segment rotated sideways</h1>
<p class="vtext">ᠮᠣᠩᠭᠣᠯ <span class="latin-sideways">Ulaanbaatar</span> ᠪᠢᠴᠢᠭ᠌</p>
</body>
</html>
