<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>vertical-rl + Noto Serif SC</title>
<style>
@font-face {
    font-family: "Noto Serif SC";
    src: url("../../../fonts/NotoSerifCJKsc-Regular.otf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Noto Serif SC";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 260px;
}
</style>
</head>
<body>
<h1>vertical-rl + Noto Serif SC</h1>
<p class="vtext">春眠不觉晓，处处闻啼鸟。</p>
</body>
</html>
