<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ruby annotations with Noto Sans JP</title>
<style>
@font-face {
    font-family: "Noto Sans JP";
    src: url("../../../fonts/NotoSansCJKjp-Regular.otf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Noto Sans JP";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 280px;
}

rt {
    font-family: "Noto Sans JP";
    font-size: 11px;
}
</style>
</head>
<body>
<h1>ruby annotations with Noto Sans JP</h1>
<p class="vtext"><ruby>漢字<rt>かんじ</rt></ruby>と<ruby>平仮名<rt>ひらがな</rt></ruby>を読む</p>
</body>
</html>
