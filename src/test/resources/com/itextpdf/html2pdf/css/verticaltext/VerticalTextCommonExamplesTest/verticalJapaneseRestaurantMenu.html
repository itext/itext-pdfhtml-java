<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    body { margin: 20pt; }
    .menu-box {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        display: inline-block;
        height: 330pt;
        padding: 16pt;
        border: 2px solid #4a3b2a;
        background-color: #faf6ee;
        line-height: 2;
    }
    .menu-title { font-size: 26pt; margin-left: 24pt; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { font-size: 16pt; margin-left: 10pt; }
    .price { font-size: 12pt; }
    .note { font-size: 9pt; }
</style>
</head>
<body>
<div class="menu-box">
<div class="menu-title">お品書き</div>
<ul>
<li>天ぷら盛り合わせ<span class="price">　千二百円</span></li>
<li>刺身五点盛り<span class="price">　千八百円</span></li>
<li>焼き鳥三本<span class="price">　六百円</span></li>
<li>茶碗蒸し<span class="price">　四百円</span></li>
<li>日本酒一合<span class="price">　七百円</span></li>
</ul>
<div class="note">※価格はすべて税込です</div>
</div>
</body>
</html>
