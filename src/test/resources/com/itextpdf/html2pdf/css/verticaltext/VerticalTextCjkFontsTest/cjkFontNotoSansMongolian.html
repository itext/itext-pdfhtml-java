<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>vertical-lr + Noto Sans Mongolian, natural orientation</title>
<style>
@font-face {
    font-family: "Noto Sans Mongolian";
    src: url("../../../fonts/NotoSansMongolian-Regular.ttf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    font-family: "Noto Sans Mongolian";
    font-size: 24px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 260px;
}
</style>
</head>
<body>
<h1>vertical-lr + Noto Sans Mongolian, natural cursive vertical orientation, no text-orientation override</h1>
<p class="vtext">ᠮᠣᠩᠭᠣᠯ ᠪᠢᠴᠢᠭ᠌</p>
</body>
</html>
