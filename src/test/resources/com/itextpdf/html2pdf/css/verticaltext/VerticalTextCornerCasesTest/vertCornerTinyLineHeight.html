<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr text with line-height 1px, far smaller than the font size</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    font-size: 20px;
    line-height: 1px;
    border: 1px solid #999;
    padding: 8px;
    margin: 0;
    height: 160px;
}
</style>
</head>
<body>
<h1>vertical-lr text with font-size 20px but line-height 1px, so adjacent columns should crowd or overlap</h1>
<p class="vtext">several characters in a row to show column crowding</p>
</body>
</html>
