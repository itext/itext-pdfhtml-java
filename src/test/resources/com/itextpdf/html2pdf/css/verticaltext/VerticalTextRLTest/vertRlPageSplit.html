<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-rl</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    height: 300px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
}
</style>
</head>
<body>
<h1>vertical-rl</h1>
<div style="height: 640px;"></div>
<p class="vtext" style="width: 50px">The quick brown fox jumps over the lazy dog. 1234567890 ABCDEFG abcdefg.</p>
</body>
</html>
