<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-rl + text-align</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.row {
    gap: 24px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 20px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 320px;
    display: inline-block;
}

.ta-start {
    text-align: start;
}

.ta-center {
    text-align: center;
}

.ta-end {
    text-align: end;
}

.ta-justify {
    text-align: justify;
}
</style>
</head>
<body>
<h1>vertical-rl + text-align</h1>
<div class="row">
<p class="vtext ta-start">start aligned text</p>
<p class="vtext ta-center">center aligned text</p>
<p class="vtext ta-end">end aligned text</p>
<p class="vtext ta-justify">justify spread text sample content</p>
</div>
</body>
</html>
