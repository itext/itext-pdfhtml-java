<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKtc';
        src: url('../../../fonts/NotoSansCJKtc-Regular.otf') format('opentype');
    }
    body { margin: 20pt; }
    .poem {
        font-family: 'NotoSansCJKtc';
        writing-mode: vertical-rl;
        text-orientation: upright;
        display: inline-block;
        height: 300pt;
        padding: 14pt;
        border: 1px solid #333;
        line-height: 2.2;
    }
    .title { font-size: 26pt; margin-left: 12pt; }
    .poet { font-size: 14pt; margin-left: 24pt; }
    .line { font-size: 22pt; }
</style>
</head>
<body>
<div class="poem">
<div class="title">靜夜思</div>
<div class="poet">唐　李白</div>
<div class="line">牀前明月光，</div>
<div class="line">疑是地上霜。</div>
<div class="line">舉頭望明月，</div>
<div class="line">低頭思故鄉。</div>
</div>
</body>
</html>
