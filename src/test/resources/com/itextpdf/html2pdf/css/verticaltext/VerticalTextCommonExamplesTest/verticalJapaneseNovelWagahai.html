<h1>吾輩は猫である</h1>
<div class="author"><ruby>夏目漱石<rt>なつめそうせき</rt></ruby></div>
<h2>一</h2>
<p><ruby>吾輩<rt>わがはい</rt></ruby>は猫である。<ruby>名前<rt>なまえ</rt></ruby>はまだ無い。</p>
<p>どこで<ruby>生<rt>うま</rt></ruby>れたかとんと<ruby>見当<rt>けんとう</rt></ruby>がつかぬ。何でも<ruby>薄暗<rt>うすぐら</rt></ruby>いじめじめした所でニャーニャー泣いていた事だけは<ruby>記憶<rt>きおく</rt></ruby>している。<ruby>吾輩<rt>わがはい</rt></ruby>はここで始めて人間というものを見た。しかもあとで聞くとそれは<ruby>書生<rt>しょせい</rt></ruby>という人間中で一番<ruby>獰悪<rt>どうあく</rt></ruby>な<ruby>種族<rt>しゅぞく</rt></ruby>であったそうだ。この書生というのは時々我々を<ruby>捕<rt>つかま</rt></ruby>えて<ruby>煮<rt>に</rt></ruby>て食うという話である。</p>
