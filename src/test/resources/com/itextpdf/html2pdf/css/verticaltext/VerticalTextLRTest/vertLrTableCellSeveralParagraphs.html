<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vertical-lr + table cell + several paragraphs</title>
    <style>
        h1 {
            font-size: 16px;
        }

        body {
            font-family: sans-serif;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
        }

        .vtext {
            writing-mode: vertical-lr;
            text-orientation: upright;
        }
    </style>
</head>
<body>
<h1>vertical-lr + table cell + several paragraphs</h1>
<div class="vtext" style="text-align: left; vertical-align: top; border: 1px solid #999; display: inline">
    <p style="background-color: #ffdeef; height: 50px;">Left</p>
    <br>
    <p style="background-color: #e8fcff; text-align: right;">Right</p>
    <br>
    <p style="background-color: #ffdeef; height: 200px; text-align: center;">Center</p>
</div>
<div class="vtext" style="text-align: right; vertical-align: bottom; border: 1px solid #999; display: inline">
    <p style="background-color: #ffdeef; height: 50px;">Right</p>
    <br>
    <p style="background-color: #e8fcff;">Right</p>
    <br>
    <p style="background-color: #ffdeef; height: 150px;">Right</p>
</div>
<table>
    <tr>
        <th class="vtext" style="text-align: left; vertical-align: top;">
            <p style="background-color: #ffdeef; height: 50px;">Left</p>
            <br>
            <p style="background-color: #e8fcff; text-align: right;">Right</p>
            <br>
            <p style="background-color: #ffdeef; height: 200px; text-align: center;">Center</p>
        </th>
        <th class="vtext" style="text-align: right; vertical-align: bottom;">
            <p style="background-color: #ffdeef; height: 50px;">Right</p>
            <br>
            <p style="background-color: #e8fcff;">Right</p>
            <br>
            <p style="background-color: #ffdeef; height: 150px;">Right</p>
        </th>
        <th class="vtext">Default vertical</th>
    </tr>
    <tr>
        <td>Row horizontal value A</td>
        <td>Row horizontal value B</td>
        <td>Row horizontal value C</td>
    </tr>
    <tr>
        <th style="text-align: left; vertical-align: top;">
            <p style="background-color: #ffdeef; width: 50px;">Left</p>
            <br>
            <p style="background-color: #e8fcff; text-align: right;">Right</p>
            <br>
            <p style="background-color: #ffdeef; width: 100px; text-align: center;">Center</p>
        </th>
        <th style="text-align: right; vertical-align: bottom;">
            <p style="background-color: #ffdeef; width: 50px;">Right</p>
            <br>
            <p style="background-color: #e8fcff;">Right</p>
            <br>
            <p style="background-color: #ffdeef; width: 100px;">Right</p>
        </th>
        <th>Default horizontal</th>
    </tr>
</table>
</body>
</html>
