<!-- Tests: text-autospace: normal adding spacing between CJK and Latin/digit runs -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    .col {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        font-size: 16pt;
        line-height: 1.8;
        border: 1px solid black;
        display: inline-block;
        padding: 10px;
        margin-right: 14px;
    }
    .autospace {
        text-autospace: normal;
    }
</style>
</head>
<body>
<div class="col">価格はUSD100で、在庫はABC倉庫に約50個あります。</div>
<div class="col autospace">価格はUSD100で、在庫はABC倉庫に約50個あります。</div>
</body>
</html>
