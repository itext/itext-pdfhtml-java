<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr + position absolute</title>
<style>
    body {
        font-family: Helvetica;
    }
    .vertical {
        writing-mode: vertical-lr;
        text-orientation: upright;
    }
</style>
</head>
<body>
    <p style="height: 200pt; background-color: lightgray">
        <span class="vertical" style="background-color: magenta">some very long text chunk with vertical writing</span>
        <span class="vertical" style="background-color: cyan">second text chunk </span>
        <span class="vertical" style="background-color: orange"> small chunk</span>
    </p>
</body>
</html>
