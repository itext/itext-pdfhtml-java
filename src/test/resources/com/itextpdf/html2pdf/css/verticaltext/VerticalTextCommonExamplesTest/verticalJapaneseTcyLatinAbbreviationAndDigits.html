<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoSansCJKjp';
        src: url('../../../fonts/NotoSansCJKjp-Regular.otf') format('opentype');
    }
    .vertical {
        font-family: 'NotoSansCJKjp';
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 14pt;
        line-height: 2;
        border: 1px solid black;
        display: inline-block;
        padding: 10pt;
    }
    .tcy { text-combine-upright: all; }
</style>
</head>
<body>
<div class="vertical">この製品は<span class="tcy">JIS</span>規格<span class="tcy">Z8703</span>に準拠しており、<span class="tcy">2026</span>年<span class="tcy">4</span>月に発売予定です。型番は<span class="tcy">AB</span>－<span class="tcy">123</span>です。</div>
</body>
</html>
