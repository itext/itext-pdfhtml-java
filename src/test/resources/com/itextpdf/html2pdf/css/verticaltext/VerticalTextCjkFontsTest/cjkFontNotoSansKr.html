<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>vertical-rl + Noto Sans KR</title>
<style>
@font-face {
    font-family: "Noto Sans KR";
    src: url("../../../fonts/NotoSansCJKkr-Regular.otf");
}

h1 {
    font-size: 16px;
    font-family: sans-serif;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Noto Sans KR";
    font-size: 22px;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 260px;
}
</style>
</head>
<body>
<h1>vertical-rl + Noto Sans KR</h1>
<p class="vtext">안녕하세요, 세계</p>
</body>
</html>
