<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vertical-lr text with enormous padding and a background color</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    background-color: #fdf3d0;
    border: 1px solid #999;
    padding: 150px;
    margin: 0;
    height: 60px;
}
</style>
</head>
<body>
<h1>vertical-lr text with 150px padding on every side and a background color, showing how far the color extends beyond the text</h1>
<p class="vtext">short text surrounded by a huge padded background area</p>
</body>
</html>
