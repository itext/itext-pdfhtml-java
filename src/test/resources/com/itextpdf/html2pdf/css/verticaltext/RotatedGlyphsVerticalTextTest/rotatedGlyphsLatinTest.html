<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Text combine upright: orientations</title>
    <style>
        .vertical {
            writing-mode: vertical-lr;
            text-orientation: upright;
            height: 500px;
            border: 1px solid black;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <p class="vertical">
        <span>Some text (latin) [in english] {vertical} to demonstrate "sideways" rotation/positioning of special-glyphs.</span>
        <span>&#x0028 &#x3000 &#x0029 &#x005B &#x002D &#x005D &#x007B &#x2010 &#x007D &#x003C &#x2011 &#x003E &#x2012 &#x2013 &#x2014 &#x2015 &#x2212 &#xFE58 &#x005F &#x002F &#x007E &#x005C &#x0022 &#x0027 &#x201C &#x2018 &#x201D &#x2019</span>
    </p>
</body>
</html>
