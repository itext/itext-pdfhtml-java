<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>a box sized with no slack, intended to fit exactly one character</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: times;
    padding: 20px;
}

.vtext {
    writing-mode: vertical-lr;
    text-orientation: upright;
    font-size: 20px;
    line-height: 1;
    border: 1px solid #999;
    padding: 0;
    margin: 0;
    height: 20px;
    width: 20px;
    overflow: visible;
}
</style>
</head>
<body>
<h1>a box with height and width both set to exactly one character's approximate natural size, no slack at all</h1>
<p class="vtext">A</p>
</body>
</html>
