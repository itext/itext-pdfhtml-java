<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>four alternating writing-mode and direction lanes in same paragraph</title>
<style>
h1 {
    font-size: 16px;
}

body {
    font-family: sans-serif;
    padding: 20px;
}

.vtext {
    text-orientation: upright;
    border: 1px solid #999;
    padding: 10px;
    margin: 0;
    height: 260px;
}

.lane-1 {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    direction: ltr;
    border: 1px dashed #c0392b;
    padding: 3px;
    vertical-align: middle;
}

.lane-2 {
    display: inline-block;
    writing-mode: vertical-lr;
    text-orientation: upright;
    direction: ltr;
    border: 1px dashed #2980b9;
    padding: 3px;
    vertical-align: middle;
}

.lane-3 {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    direction: rtl;
    border: 1px dashed #27ae60;
    padding: 3px;
    vertical-align: middle;
}

.lane-4 {
    display: inline-block;
    writing-mode: vertical-lr;
    text-orientation: upright;
    direction: rtl;
    border: 1px dashed #8e44ad;
    padding: 3px;
    vertical-align: middle;
}
</style>
</head>
<body>
<h1>four alternating writing-mode and direction lanes in same paragraph</h1>
<p class="vtext"><span class="lane-1">lane one rl ltr</span> <span class="lane-2">lane two lr ltr</span> <span class="lane-3">lane three rl rtl</span> <span class="lane-4">lane four lr rtl</span></p>
</body>
</html>
