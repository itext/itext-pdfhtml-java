<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radial gradient position grammar</title>
</head>
<body>
<h1>Radial gradient position grammar</h1>
<h2>position one</h2>
<div style="background-image: radial-gradient(at left, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at center, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at right, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at top, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at 25%, red, blue); width: 300pt; height: 80pt;"></div>
<h2>position two keywords</h2>
<div style="background-image: radial-gradient(at left top, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at top left, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at center bottom, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at bottom center, red, blue); width: 300pt; height: 80pt;"></div>
<h2>position two lengths and percentages</h2>
<div style="background-image: radial-gradient(at 25% 75%, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at 20px 30px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at 25% 30px, red, blue); width: 300pt; height: 80pt;"></div>
<h2>position four edge offsets</h2>
<div style="background-image: radial-gradient(at left 10px top 20px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at top 20px left 10px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at right 10px bottom 20px, red, blue); width: 300pt; height: 80pt;"></div>
<h2>invalid position combinations</h2>
<div style="background-image: radial-gradient(at left right, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at 50% left, red, blue); width: 300pt; height: 80pt;"></div>
<h2>negative edge offsets</h2>
<div style="background-image: radial-gradient(at left -10px top -20px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(at right -10px bottom -20px, red, blue); width: 300pt; height: 80pt;"></div>
</body>
</html>
