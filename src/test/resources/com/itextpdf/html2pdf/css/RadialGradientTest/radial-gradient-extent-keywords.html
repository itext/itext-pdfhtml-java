    <title>Radial gradient extent keywords</title>
</head>
<body>
<h1>Radial gradient extent keywords</h1>
<h2>closest-side</h2>
<div style="background-image: radial-gradient(ellipse closest-side at center, red, blue); width: 300pt; height: 100pt;"></div>
<h2>farthest-side</h2>
<div style="background-image: radial-gradient(ellipse farthest-side at center, red, blue); width: 300pt; height: 100pt;"></div>
<h2>closest-corner</h2>
<div style="background-image: radial-gradient(ellipse closest-corner at center, red, blue); width: 300pt; height: 100pt;"></div>
<h2>farthest-corner</h2>
<div style="background-image: radial-gradient(ellipse farthest-corner at center, red, blue); width: 300pt; height: 100pt;"></div>
</body>
