<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radial gradient size grammar</title>
</head>
<body>
<h1>Radial gradient size grammar</h1>
<h2>extent keywords</h2>
<div style="background-image: radial-gradient(closest-corner, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(closest-side, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(farthest-corner, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(farthest-side, red, blue); width: 300pt; height: 80pt;"></div>
<h2>single circle sizes</h2>
<div style="background-image: radial-gradient(50px, red, blue); width: 300pt; height: 80pt;"></div>
<h2>two ellipse sizes</h2>
<div style="background-image: radial-gradient(100px 50px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(50% 25%, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(100px 25%, red, blue); width: 300pt; height: 80pt;"></div>
<h2>sizes with position</h2>
<div style="background-image: radial-gradient(circle 50px at center, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(50% 25% at right 10px bottom 20px, red, blue); width: 300pt; height: 80pt;"></div>
<h2>invalid size combinations</h2>
<div style="background-image: radial-gradient(circle 50px 25px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(ellipse 50px, red, blue); width: 300pt; height: 80pt;"></div>
</body>
</html>
