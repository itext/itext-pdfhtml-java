<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radial gradient shape grammar</title>
</head>
<body>
<h1>Radial gradient shape grammar</h1>
<h2>shape only</h2>
<div style="background-image: radial-gradient(circle, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(ellipse, red, blue); width: 300pt; height: 80pt;"></div>
<h2>shape with position</h2>
<div style="background-image: radial-gradient(circle at center, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(ellipse at left top, red, blue); width: 300pt; height: 80pt;"></div>
<h2>shape with length sizes</h2>
<div style="background-image: radial-gradient(circle 50px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(50px circle, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(ellipse 100px 50px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(100px 50px ellipse, red, blue); width: 300pt; height: 80pt;"></div>
<h2>shape with percentage sizes</h2>
<div style="background-image: radial-gradient(ellipse 50% 25%, red, blue); width: 300pt; height: 80pt;"></div>
<h2>shape with extent and complete prelude</h2>
<div style="background-image: radial-gradient(circle closest-side at right 10px bottom 20px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(closest-side circle at right 10px bottom 20px, red, blue); width: 300pt; height: 80pt;"></div>
<div style="background-image: radial-gradient(farthest-corner ellipse at 25% 75%, red, blue); width: 300pt; height: 80pt;"></div>
</body>
</html>
